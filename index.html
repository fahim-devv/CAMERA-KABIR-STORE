<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabir CCTV - Security Systems</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #080a0f; color: #f1f5f9; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(10, 15, 26, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }
        .gold-glow { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.3); }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.5);
        }
        .modal-active { display: flex !important; }
        .modal-hidden { display: none !important; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <div id="toast-container" class="space-y-2"></div>

    <!-- Login / Signup Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-xl modal-active transition-all">
        <div class="glass-modal p-8 rounded-3xl w-full max-w-md gold-glow mx-4 relative overflow-hidden">
            <div class="text-center mb-8 relative z-10">
                <div class="w-16 h-16 bg-amber-500/10 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-amber-500/30">
                    <i class="fa-solid fa-shield-cat text-3xl text-amber-500"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white tracking-wide">Kabir CCTV Portal</h2>
                <p class="text-xs text-slate-400 mt-1">Enter details to sign in</p>
            </div>

            <div class="space-y-4 relative z-10">
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1.5">Full Name</label>
                    <input type="text" id="username" placeholder="e.g. Fahim Hasan" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1.5">Mobile Number</label>
                    <input type="tel" id="userphone" placeholder="e.g. 01700000000" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition">
                </div>
